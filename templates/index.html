<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegioVal - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 22px; font-weight: bold; color: #38bdf8; }
        .user-nav { display: flex; align-items: center; gap: 16px; }
        .user-name { color: #94a3b8; font-size: 14px; }
        .btn-logout { background-color: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; width: 100%; }
        
        .card { background-color: #1e293b; border-radius: 12px; padding: 32px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 24px; }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 20px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; outline: none; font-size: 15px; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        
        .result-box { background-color: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 20px; margin-top: 24px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
        .result-row.highlight { font-size: 18px; font-weight: bold; color: #38bdf8; border-top: 1px solid #334155; padding-top: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">RegioVal</div>
        <div class="user-nav">
            <span class="user-name">Halo, <strong>{{USERNAME}}</strong>!</span>
            <a href="/login" class="btn-logout">Logout</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Kalkulator Pricing Engine Regional</h2>
            <form method="POST" action="/calculate">
                <div class="form-group">
                    <label for="base_price">Harga Base Game (USD $):</label>
                    <input type="number" step="0.01" id="base_price" name="base_price" value="59.99" required>
                </div>
                <div class="form-group">
                    <label for="currency">Pilih Negara / Mata Uang Tujuan:</label>
                    <select id="currency" name="currency">
                        <option value="IDR">Indonesia (Rupiah - IDR)</option>
                        <option value="BRL">Brazil (Real - BRL)</option>
                        <option value="ARG">Argentina (Peso - ARG)</option>
                        <option value="EUR">Eurozone (Euro - EUR)</option>
                    </select>
                </div>
                <button type="submit">Hitung Rekomendasi Harga</button>
            </form>

            <!-- Menampilkan hasil kalkulasi jika ada -->
            {{RESULT_SECTION}}
        </div>
    </div>

</body>
</html>
