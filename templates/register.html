<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegioVal - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        p.footer { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        p.footer a { color: #38bdf8; text-decoration: none; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; text-align: center; }
        .alert-error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        .alert-success { background-color: #14532d; color: #86efac; border: 1px solid #166534; }
    </style>
</head>
<body>
    <div class="card">
        <h2>RegioVal</h2>
        
        <!-- Pesan Error / Sukses Dinamis -->
        {{MESSAGE}}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit">Daftar Akun</button>
        </form>
        <p class="footer">Sudah punya akun? <a href="/login">Login di sini</a></p>
    </div>
</body>
</html>
